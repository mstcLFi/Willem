<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Splitsen</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; }
  body { display: flex; justify-content: center; align-items: center; padding: 2vw; background: #f0f4f8; }

  #container {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    height: 100%;
    aspect-ratio: 3 / 4;
    max-width: 800px;
    max-height: 95vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
    overflow: hidden;
    gap: 1rem;
  }

  #container::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0.25;
    z-index: 0;
    transition: opacity 0.3s;
  }

  #container > * { position: relative; z-index: 1; }

  h1 { margin: 10px 0; font-size: clamp(1.5rem, 4vw, 2em); }

  #level { position: absolute; top: 10px; left: 20px; font-size: 1.2rem; font-weight: bold; }

  .question { font-size: 1.3rem; margin: 1rem 0; text-align:center; }
  .answers { display: grid; gap: 0.5rem; width: 100%; }
  .answer {
    padding: 0.7rem; border: 1px solid #ccc; border-radius: 12px;
    background: #f9f9f9; cursor: pointer; transition: background 0.2s;
    text-align: center; font-size: 1.1rem;
  }
  .answer:hover { background: #eef; }
  .correct { background: #c8f7c5 !important; }
  .wrong { background: #f7c5c5 !important; }

  #lastWrong { color: red; font-size: 0.9rem; margin-top: 0.25rem; min-height: 1.2em; }

  #progressContainer { width: 100%; height: 15px; background: #ddd; border-radius: 8px; overflow: hidden; margin-top: auto; }
  #progressBar { height: 100%; width: 0%; background: #4caf50; transition: width 0.3s; }

  #bgColorPickerContainer {
    position: absolute;
    top: 10px; right: 20px;
    background: #fff; padding: 5px 10px; border-radius: 10px;
    z-index: 2;
  }

  #successImageOverlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    z-index: 10;
    display: none;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="container">
  <div id="bgColorPickerContainer">
    <input type="color" id="bgColorPicker" />
  </div>

  <div id="level">Level 1</div>
  <h1>Splitsen</h1>
  <div class="question" id="question"></div>
  <div class="answers" id="answers"></div>
  <div id="lastWrong"></div>
  <div id="progressContainer"><div id="progressBar"></div></div>

  <div id="successImageOverlay"></div>

  <audio id="successSound" src="sounds/success.mp3"></audio>
  <audio id="wrong1Sound" src="sounds/wrong2.mp3"></audio>
  <audio id="wrongStartSound" src="sounds/wrong.mp3"></audio>
</div>

<script>
// --- Helpers & state ---
const qElem = document.getElementById("question");
const aElem = document.getElementById("answers");
const lastWrongElem = document.getElementById("lastWrong");
const successSound = document.getElementById("successSound");
const wrongSound = document.getElementById("wrong1Sound");
const wrongStartSound = document.getElementById("wrongStartSound");
const levelElem = document.getElementById("level");
const progressBar = document.getElementById("progressBar");
const bgColorPicker = document.getElementById("bgColorPicker");
const successOverlay = document.getElementById("successImageOverlay");

// New image set
const successImages = [
  'russianblue images/cat-1846101_1280.jpg',
  'russianblue images/cat-2480769_1280.jpg',
  'russianblue images/cat-2480773_1280.jpg',
  'russianblue images/cat-2480777_1280.jpg',
  'russianblue images/cat-3853399_1280.jpg',
  'russianblue images/cat-4540443_1280.jpg',
  'russianblue images/cat-6985007_1280.jpg',
  'russianblue images/cat-8176158_1280.jpg',
  'russianblue images/pet-5728249_1280.jpg',
  'russianblue images/russian-blue-7618223_1280.jpg',
];

let level = 1;           // Levels 1..5
let progress = 0;        // 0..10 → level up
let wrongStreak = 0;

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr){ return arr.sort(() => Math.random() - 0.5); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function safePlay(el){ try { el.currentTime = 0; const p = el.play(); if (p && typeof p.catch === 'function') p.catch(()=>{}); } catch(_){} }

// --- Question generation (robust, no risky loops) ---
function makeNumberOptions(correct, maxVal){
  const candidates = [correct-1, correct+1, correct+2, correct-2, correct+3, correct-3]
    .map(v => clamp(v, 0, maxVal))
    .filter(v => v !== correct);
  const seen = new Set();
  const out = [];
  for(const v of candidates){ if(!seen.has(v)){ seen.add(v); out.push(v); } if(out.length===3) break; }
  // Fallback fill
  let tries = 0;
  while(out.length < 3 && tries < 50){
    const v = clamp(correct + randInt(-5,5), 0, maxVal);
    if(v !== correct && !seen.has(v)){ seen.add(v); out.push(v); }
    tries++;
  }
  return shuffle([correct, ...out]).map(String);
}

function makePairOptions(n1, hi){
  const a = randInt(0, n1); const b = n1 - a; // correct pair
  const correct = `${a} en ${b}`;
  const pairs = [correct];

  // Deterministic distractors that DO NOT sum to n1
  const candidates = [
    [clamp(a+1,0,hi), b],
    [a, clamp(b+2,0,hi)],
    [clamp(a+2,0,hi), clamp(b+2,0,hi)],
    [clamp(a-1,0,hi), b],
    [a, clamp(b-2,0,hi)]
  ];

  const labels = new Set([correct]);
  for(const [x,y] of candidates){
    if(x + y !== n1){
      const lab = `${x} en ${y}`;
      if(!labels.has(lab)) { labels.add(lab); pairs.push(lab); }
      if(pairs.length === 4) break;
    }
  }

  // Fallback random fillers if still short
  let safety = 0;
  while(pairs.length < 4 && safety < 200){
    let x = randInt(0, hi), y = randInt(0, hi);
    if(x + y === n1) { y = (y+1) <= hi ? y+1 : Math.max(0, y-1); }
    const lab = `${x} en ${y}`;
    if(!labels.has(lab)) { labels.add(lab); pairs.push(lab); }
    safety++;
  }

  return { correct, options: shuffle(pairs) };
}

function generateSplitQuestion(){
  let n1, n2, text, correct, options;

  if (level === 1) {
    n1 = randInt(1, 10);
    n2 = randInt(0, n1);
    text = `Het getal ${n1} kun je splitsen in ${n2} en ?`;
    const answer = n1 - n2;
    correct = String(answer);
    options = makeNumberOptions(answer, n1);
  }
  else if (level === 2) {
    n1 = randInt(8, 12);
    n2 = randInt(0, Math.min(12, n1));
    text = `Het getal ${n1} kun je splitsen in ${n2} en ?`;
    const answer = n1 - n2;
    correct = String(answer);
    options = makeNumberOptions(answer, n1);
  }
  else if (level >= 3 && level <= 5) {
    const ranges = {3:[1,10], 4:[1,15], 5:[1,25]};
    const [lo, hi] = ranges[level];
    n1 = randInt(lo, hi);
    text = `Het getal ${n1} kun je splitsen in ? en ?`;
    const pair = makePairOptions(n1, hi);
    correct = pair.correct;
    options = pair.options;
  }
  else {
    // Safe fallback to a level-1 style question
    n1 = randInt(1, 10);
    n2 = randInt(0, n1);
    text = `Het getal ${n1} kun je splitsen in ${n2} en ?`;
    const answer = n1 - n2;
    correct = String(answer);
    options = makeNumberOptions(answer, n1);
  }

  return { text, correct, options };
}

function updateProgress() { progressBar.style.width = (progress * 10) + '%'; }

function showSuccessImage() {
  const img = successImages[Math.floor(Math.random() * successImages.length)];
  successOverlay.style.backgroundImage = `url('${img}')`;
  successOverlay.style.backgroundColor = bgColorPicker.value;
  successOverlay.style.display = 'block';
  successOverlay.onclick = () => { successOverlay.style.display = 'none'; successOverlay.onclick = null; };
}

function renderQuestion(q){
  qElem.textContent = q.text;
  aElem.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('div');
    btn.className = 'answer';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt, q);
    aElem.appendChild(btn);
  });
}

function handleAnswer(opt, q){
  const buttons = [...document.querySelectorAll('.answer')];
  if (opt === q.correct) {
    const btn = buttons.find(b => b.textContent === opt);
    if (btn) btn.classList.add('correct');
    safePlay(successSound);
    wrongStreak = 0;
    progress++;
    if (progress >= 10) {
      level = Math.min(5, level + 1);
      progress = 0;
      showSuccessImage();
    }
    levelElem.textContent = `Level ${level}`;
    updateProgress();
    setTimeout(() => newRound(), 500);
  } else {
    const btn = buttons.find(b => b.textContent === opt);
    if (btn) btn.classList.add('wrong');
    if (progress === 0) safePlay(wrongStartSound); else safePlay(wrongSound);
    wrongStreak++;
    progress = 0;
    if (wrongStreak >= 2) { level = Math.max(1, level - 1); wrongStreak = 0; }
    levelElem.textContent = `Level ${level}`;
    updateProgress();
    setTimeout(() => newRound(q.text, q.correct), 500);
  }
}

function newRound(prevQuestion = null, prevAnswer = null) {
  try {
    const q = generateSplitQuestion();
    lastWrongElem.textContent = prevQuestion && prevAnswer ? `Fout! ${prevQuestion} = ${prevAnswer}` : '';
    renderQuestion(q);
    updateProgress();
  } catch (err) {
    console.error(err);
    lastWrongElem.textContent = 'Er ging iets mis bij het laden van de vraag. Probeer opnieuw.';
    // Try to recover gracefully
    setTimeout(() => { try { renderQuestion(generateSplitQuestion()); } catch(_){} }, 300);
  }
}

// Background color persistence
window.addEventListener('DOMContentLoaded', () => {
  try {
    const savedColor = localStorage.getItem('bgColor');
    if (savedColor) {
      document.body.style.backgroundColor = savedColor;
      bgColorPicker.value = savedColor;
    }
  } catch(_){}
});

bgColorPicker.addEventListener('input', (e) => {
  const color = e.target.value;
  document.body.style.backgroundColor = color;
  try { localStorage.setItem('bgColor', color); } catch(_){}
  if (successOverlay.style.display === 'block') successOverlay.style.backgroundColor = color;
});

// Last-resort error reporter (so it never "silently" hangs)
window.addEventListener('error', (e) => {
  lastWrongElem.textContent = `Scriptfout: ${e.message || 'onbekend'}`;
});

newRound();
</script>
</body>
</html>
