<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willem's tafelspelletjes</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .tile {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-decoration: none;
            color: black;
        }
        .tile img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }
        .tile:hover img {
            filter: grayscale(0%);
        }
        .tile-title {
            padding: 10px;
            font-size: 1.1em;
            text-align: center;
        }
        @media (max-width: 600px) {
            .tile img {
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="brainrotstyle.html" class="tile">
            <img src="brainrot images/chimpanzini bananini.webp" alt="Oefenen" style="object-position: top center;">
            <div class="tile-title">Oefenen</div>
        </a>
        <a href="minecraftstyle.html" class="tile">
            <img src="minecraft images/4.jpg" alt="Lokale competitie" style="object-position: top center;">
            <div class="tile-title">Lokale competitie</div>
        </a>
        <a href="multiplicationrace.html" class="tile">
            <img src="brainrot images/tralalero tralala.webp" alt="Online competitie" style="object-position: center;">
            <div class="tile-title">Online competitie</div>
        </a>
        <a href="memory.html" class="tile">
            <img src="brainrot images/memory.jpg" alt="Memory" style="object-position: center;">
            <div class="tile-title">Memory</div>
        </a>
        <a href="dinoclock.html" class="tile">
            <img src="dinosaur images/triceratopsje.png" alt="Klokkijken" style="object-position: center;">
            <div class="tile-title">Klokkijken</div>
        </a>
        <a href="fractions.html" class="tile">
            <img src="horse images/iceland-2420768_1280.jpg" alt="Breuken" style="object-position: center;">
            <div class="tile-title">Breuken</div>
        </a>
        <!-- Voeg hier meer tegels toe -->
    </div>
</body>
</html>
