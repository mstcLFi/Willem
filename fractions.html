<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Breuken</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; }
  body { display: flex; justify-content: center; align-items: center; padding: 2vw; background: #f0f4f8; }

  #container {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    background: rgba(255, 255, 255, 0.85); /* white with 85% opacity */
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    height: 100%;
    aspect-ratio: 3 / 4;
    max-width: 800px;
    max-height: 95vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
    overflow: hidden;
    gap: 1rem;
  }

  #container::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0.25;
    z-index: 0;
    transition: opacity 0.3s;
  }

  #container > * { position: relative; z-index: 1; }

  h1 { margin: 10px 0; font-size: clamp(1.5rem, 4vw, 2em); }

  #level { position: absolute; top: 10px; left: 20px; font-size: 1.2rem; font-weight: bold; }

  .question { font-size: 1.3rem; margin: 1rem 0; }
  .answers { display: grid; gap: 0.5rem; width: 100%; }
  .answer {
    padding: 0.7rem; border: 1px solid #ccc; border-radius: 12px;
    background: #f9f9f9; cursor: pointer; transition: background 0.2s;
    text-align: center; font-size: 1.1rem;
  }
  .answer:hover { background: #eef; }
  .correct { background: #c8f7c5 !important; }
  .wrong { background: #f7c5c5 !important; }

  #lastWrong { color: red; font-size: 0.9rem; margin-top: 1rem; }

  #progressContainer { width: 100%; height: 15px; background: #ddd; border-radius: 8px; overflow: hidden; margin-top: auto; }
  #progressBar { height: 100%; width: 0%; background: #4caf50; transition: width 0.3s; }

  #bgColorPickerContainer {
    position: absolute;
    top: 10px; right: 20px;
    background: #fff; padding: 5px 10px; border-radius: 10px;
    z-index: 2;
  }

  /* Success image overlay */
  #successImageOverlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-size: contain;       /* Fit image inside container */
    background-repeat: no-repeat;
    background-position: center;
    z-index: 10;
    display: none;
    cursor: pointer;
  }

  #backArrow {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    text-decoration: none;
    color: #4caf50;
    opacity: 0.7;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 20; /* make sure it's above container */
  }
  #backArrow:hover {
    opacity: 1;
    transform: translateX(-50%) translateY(-2px);
  }

</style>
</head>
<body>

<a id="backArrow" href="index.html">←</a>

<div id="container">
  <!-- Background color picker -->
  <div id="bgColorPickerContainer">
    <input type="color" id="bgColorPicker" />
  </div>

  <div id="level">Level 1</div>
  <h1>Breuken</h1>
  <div class="question" id="question"></div>
  <div class="answers" id="answers"></div>
  <div id="lastWrong"></div>
  <div id="progressContainer"><div id="progressBar"></div></div>

  <!-- Success image overlay -->
  <div id="successImageOverlay"></div>

  <!-- Audio elements -->
  <audio id="successSound" src="sounds/success.mp3"></audio>
  <audio id="wrong1Sound" src="sounds/wrong2.mp3"></audio>
  <audio id="wrongStartSound" src="sounds/wrong.mp3"></audio>
</div>

<script>
const qElem = document.getElementById("question");
const aElem = document.getElementById("answers");
const lastWrongElem = document.getElementById("lastWrong");
const successSound = document.getElementById("successSound");
const wrongSound = document.getElementById("wrong1Sound");
const wrongStartSound = document.getElementById("wrongStartSound");
const levelElem = document.getElementById("level");
const progressBar = document.getElementById("progressBar");
const bgColorPicker = document.getElementById("bgColorPicker");
const container = document.getElementById("container");
const successOverlay = document.getElementById("successImageOverlay");

const successImages = [
  'horse images/horse-1804425_1280.jpg',
  'horse images/horse-2595445_1280.jpg',
  'horse images/horse-3390256_1280.jpg',
  'horse images/horse-561221_1280.jpg',
  'horse images/horse-6646593_1280.jpg',
  'horse images/horse-7158632_1280.jpg',
  'horse images/horses-2904536_1280.jpg',
  'horse images/iceland-2420768_1280.jpg',
  'horse images/italy-7290977_1280.jpg',
  'horse images/white-horse-3419146_1280.jpg'
];

let level = 1;
let progress = 0;
let wrongStreak = 0;
let lastQuestion = null;

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function simplifyFraction(num, den) {
  const g = gcd(num, den);
  num /= g; den /= g;
  let whole = Math.floor(num / den);
  let remainder = num % den;
  if (remainder === 0) { return `${whole}`; }
  return whole >= 1 ? `${whole} ${remainder}/${den}` : `${remainder}/${den}`;
}

function generateQuestion() {
  let num, den;
  if (level === 1) { 
    den = Math.floor(Math.random() * 9) + 2; 
    num = Math.floor(Math.random() * (den - 1)) + 1; 
  }
  else if (level === 2) { 
    num = Math.floor(Math.random() * 10) + 3; 
    den = num - 1; 
  }
  else if (level === 3) { 
    // New Level 3: numerator > denominator, no simplification, never a whole number
    den = Math.floor(Math.random() * 11) + 3; // 3–13
    do {
      num = Math.floor(Math.random() * 11) + den + 1; // ensure num > den
    } while (num % den === 0); // reject round numbers

    const correctAnswer = (() => {
      let whole = Math.floor(num / den);
      let remainder = num % den;
      return `${whole} ${remainder}/${den}`;
    })();

    const answers = new Set([correctAnswer]);
    const offsets = [-3,-2,-1,1,2,3];
    for (let offset of offsets) {
      let n = num + offset;
      if (n <= den) n = den + 1; // ensure numerator > denominator
      if (n % den === 0) n += 1; // avoid round numbers
      const ans = (() => {
        let whole = Math.floor(n / den);
        let remainder = n % den;
        return `${whole} ${remainder}/${den}`;
      })();
      if (!answers.has(ans)) answers.add(ans);
      if (answers.size >= 4) break;
    }

    while (answers.size < 4) {
      let n = num + (Math.floor(Math.random()*7)-3);
      if (n <= den) n = den + 1; 
      if (n % den === 0) n += 1; // avoid round numbers
      const ans = (() => {
        let whole = Math.floor(n / den);
        let remainder = n % den;
        return `${whole} ${remainder}/${den}`;
      })();
      if (!answers.has(ans)) answers.add(ans);
    }

    return { num, den, correct: correctAnswer, options: Array.from(answers).sort(() => Math.random()-0.5) };
  }
  else if (level === 4) { 
    // old Level 3 -> now Level 4 (simplified fractions)
    num = Math.floor(Math.random() * 13) + 3; 
    den = Math.floor(Math.random() * 13) + 3; 
  }
  else { 
    // old Level 4 -> now Level 5
    den = Math.floor(Math.random() * 9) + 2; 
    num = Math.floor(Math.random() * 100) + 1; 
    while (num % den === 0) num++; 
  }

  if (level === 1 || level === 2 || level >= 4) {
    const correctAnswer = simplifyFraction(num, den);
    const answers = new Set([correctAnswer]);
    const offsets = [-3,-2,-1,1,2,3];
    for (let offset of offsets) {
      let n = num + offset;
      if (n <= 0) n = 1;
      if (level === 5 && n % den === 0) n += 1;
      const ans = simplifyFraction(n, den);
      if (!answers.has(ans)) answers.add(ans);
      if (answers.size >= 4) break;
    }
    while (answers.size < 4) {
      let n = num + (Math.floor(Math.random()*7)-3);
      if (n <= 0) n = 1;
      if (level === 5 && n % den === 0) n += 1;
      const ans = simplifyFraction(n, den);
      if (!answers.has(ans)) answers.add(ans);
    }
    return { num, den, correct: correctAnswer, options: Array.from(answers).sort(() => Math.random()-0.5) };
  }
}

function updateProgress() {
  progressBar.style.width = (progress * 10) + '%';
}

function showHorseImage() {
  const img = successImages[Math.floor(Math.random() * successImages.length)];
  successOverlay.style.backgroundImage = `url('${img}')`;
  successOverlay.style.backgroundColor = bgColorPicker.value; // match picker
  successOverlay.style.display = 'block';

  successOverlay.onclick = () => {
    successOverlay.style.display = 'none';
    successOverlay.onclick = null;
  };
}

function newRound(prevQuestion = null, prevAnswer = null) {
  let q;
  do { q = generateQuestion(); } while (lastQuestion && q.num === lastQuestion.num && q.den === lastQuestion.den);
  lastQuestion = q;

  qElem.textContent = `${q.num} ÷ ${q.den} = ?`;
  aElem.innerHTML = "";
  lastWrongElem.textContent = prevQuestion && prevAnswer ? `Fout! ${prevQuestion} = ${prevAnswer}` : "";

  q.options.forEach(opt => {
    const btn = document.createElement("div");
    btn.className = "answer";
    btn.textContent = opt;
    btn.onclick = () => {
      if (opt === q.correct) {
        btn.classList.add("correct");
        successSound.currentTime = 0; 
        successSound.play();
        wrongStreak = 0;
        progress++;
        if (progress >= 10) {
          level++;
          if (level > 4) level = 4;
          progress = 0;
          showHorseImage();
        }
        levelElem.textContent = `Level ${level}`;
        updateProgress();
        setTimeout(() => newRound(), 500);
      } else {
        btn.classList.add("wrong");
        if (progress === 0) { wrongStartSound.currentTime = 0; wrongStartSound.play(); }
        else { wrongSound.currentTime = 0; wrongSound.play(); }

        wrongStreak++;
        progress = 0;
        if (wrongStreak >= 2) { level--; if (level < 1) level = 1; wrongStreak = 0; }
        levelElem.textContent = `Level ${level}`;
        updateProgress();
        setTimeout(() => newRound(`${q.num} ÷ ${q.den}`, q.correct), 500);
      }
    };
    aElem.appendChild(btn);
  });
  updateProgress();
}

// Background color picker
window.addEventListener("DOMContentLoaded", () => {
  const savedColor = localStorage.getItem("bgColor");
  if (savedColor) {
    document.body.style.backgroundColor = savedColor;
    bgColorPicker.value = savedColor;
  }
});

bgColorPicker.addEventListener("input", (e) => {
  const color = e.target.value;
  document.body.style.backgroundColor = color;
  localStorage.setItem("bgColor", color);

  // update overlay background if visible
  if (successOverlay.style.display === 'block') {
    successOverlay.style.backgroundColor = color;
  }
});

newRound();
</script>
</body>
</html>
